version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dc_studios_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vit_dance_studio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dc_studios_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-vit_dance_studio}
      JWT_SECRET: ${JWT_SECRET:-vit_dance_studio_secure_production_secret_key_2026}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      ALLOWED_ORIGINS: "*"
    depends_on:
      - db

volumes:
  pgdata:
